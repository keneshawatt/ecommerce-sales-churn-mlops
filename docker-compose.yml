services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      # prediction logs are written here, so they survive container restarts
      # and monitor.py can read them from your project folder
      - ./logs:/app/logs
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    # DATABASE_URL is read from your local .env at run time, never stored in the image
    env_file:
      - .env
    environment:
      # the dashboard reaches the API over the compose network
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
